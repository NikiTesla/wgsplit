name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install sing-box golangci-lint
      - run: go test ./...
      - run: golangci-lint run
